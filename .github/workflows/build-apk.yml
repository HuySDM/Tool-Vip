name: Build Android APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Biên dịch APK
        run: gradle clean assembleDebug --stacktrace

      - name: Lưu APK
        uses: actions/upload-artifact@v5
        with:
          name: APK-Cua-Ban
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
