name: Build Android APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cấp quyền chạy
        run: chmod +x gradlew

      - name: Biên dịch APK
        run: ./gradlew assembleDebug

      - name: Lưu APK
        uses: actions/upload-artifact@v4
        with:
          name: File-APK-Cua-Ban
          path: app/build/outputs/apk/debug/*.apk
